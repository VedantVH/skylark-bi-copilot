version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skylark-bi-backend
    ports:
      - "8000:8000"
    environment:
      - MONDAY_API_KEY=${MONDAY_API_KEY}
      - MONDAY_API_URL=${MONDAY_API_URL:-https://api.monday.com/v2}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skylark-bi-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
